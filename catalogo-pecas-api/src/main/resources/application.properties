spring.application.name=catalogo-pecas-api

server.port=8080

# Banco H2 em memória - nao exige nenhuma instalacao externa
spring.datasource.url=jdbc:h2:mem:catalogodb;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Console web do H2, util para mostrar os dados no video (http://localhost:8080/h2-console)
# JDBC URL a usar no login do console: jdbc:h2:mem:catalogodb
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Spring AI (Gemini) - a dependencia do pom.xml exige essa propriedade para o
# contexto subir, mesmo que ninguem chame o modelo de verdade. O fluxo de
# extracao usa o MockGeminiClient (simulacao), entao esse valor abaixo NUNCA
# e usado de fato - e so um placeholder para o Spring AI nao falhar no boot.
# Quando alguem tiver uma API key propria, basta exportar a variavel de
# ambiente GEMINI_API_KEY (sem precisar mudar esse arquivo) e trocar o
# MockGeminiClient por um ChatClient real em ConfiguracaoExtracaoCatalogo.
spring.ai.google.genai.api-key=${GEMINI_API_KEY:chave-placeholder-nao-utilizada}
